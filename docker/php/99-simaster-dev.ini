; SIMASTER dev-tuning: server HTTP memakai `php artisan serve` (SAPI CLI),
; sehingga OPcache default NONAKTIF (opcache.enable_cli=0) -> setiap request
; mengkompilasi ulang seluruh framework dari bind-mount Windows yang lambat.
; File ini mengaktifkan OPcache untuk worker serve agar request berikutnya
; instan (bytecode sudah di memori worker).
opcache.enable_cli=1
; Validasi perubahan file tetap jalan, tapi cukup tiap 10 detik (bukan tiap
; request) — stat massal di bind-mount adalah sumber jeda 2-4 detik.
opcache.revalidate_freq=10
opcache.memory_consumption=256
opcache.max_accelerated_files=30000
